<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Кибер-Нейромережа з Фото</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000308; /* Глибокий темний неоновий фон */
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <script>
        // 1. Сцена та налаштування кольору (темна кібер-атмосфера)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000308); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8); // Початкова позиція камери

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. Інтуїтивне керування (наближення пальцями/мишкою)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.minDistance = 2;      
        controls.maxDistance = 25;     

        // Створюємо головну групу, яка буде рухатися НА камеру
        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        const textureLoader = new THREE.TextureLoader();
        const count = 40; // Кількість фото-вузлів
        const meshes = [];

        const photoPaths = [
            'foto/1.jpg',
            'foto/2.jpg',
            'foto/3.jpg'
        ];

        const baseGeometry = new THREE.PlaneGeometry(1, 1);

        // 3. Генерація вузлів у формі тривимірного тунелю
        for (let i = 0; i < count; i++) {
            // Розподіляємо фото по спіралі вздовж осі Z (глибина від -20 до 20)
            const z = (i / count) * 40 - 20; 
            const angle = i * 0.8;
            const radius = 3 + Math.random() * 3; // Радіус тунелю від центру
            
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;

            const material = new THREE.MeshBasicMaterial({ 
                side: THREE.DoubleSide,
                visible: false 
            });

            const mesh = new THREE.Mesh(baseGeometry, material);
            mesh.position.set(x, y, z);
            worldGroup.add(mesh);
            meshes.push(mesh);

            // Неонова рамка для кожного фото
            const edges = new THREE.EdgesGeometry(baseGeometry);
            const lineMaterial = new THREE.LineBasicMaterial({ 
                color: 0x00f3ff, // Бірюзовий неон
                linewidth: 2 
            });
            const wireframe = new THREE.LineSegments(edges, lineMaterial);
            wireframe.position.z = 0.005;
            mesh.add(wireframe);

            // Асинхронне завантаження фото
            textureLoader.load(photoPaths[i % 3], function(texture) {
                const aspect = texture.image.width / texture.image.height;
                const baseHeight = 1.2;
                const targetWidth = baseHeight * aspect;

                mesh.scale.set(targetWidth, baseHeight, 1);
                material.map = texture;
                material.visible = true;
                material.needsUpdate = true;
            });
        }

        // 4. Створення сітки нейронних зв'язків (ліній між фото)
        const lineGeometry = new THREE.BufferGeometry();
        const linePositions = [];
        const lineColors = [];
        const colorNeonBlue = new THREE.Color(0x00f3ff);
        const colorNeonPink = new THREE.Color(0xff0077);

        for (let i = 0; i < count; i++) {
            // З'єднуємо кожне фото з двома наступними сусідніми
            for (let j = 1; j <= 2; j++) {
                const nextIndex = (i + j) % count;
                
                // Координати початку і кінця лінії
                linePositions.push(meshes[i].position.x, meshes[i].position.y, meshes[i].position.z);
                linePositions.push(meshes[nextIndex].position.x, meshes[nextIndex].position.y, meshes[nextIndex].position.z);
                
                // Градієнт кольорів для ліній (як у відео)
                const chosenColor = Math.random() > 0.5 ? colorNeonBlue : colorNeonPink;
                lineColors.push(chosenColor.r, chosenColor.g, chosenColor.b);
                lineColors.push(chosenColor.r, chosenColor.g, chosenColor.b);
            }
        }

        lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
        lineGeometry.setAttribute('color', new THREE.Float32BufferAttribute(lineColors, 3));

        const networkMaterial = new THREE.LineBasicMaterial({ 
            vertexColors: true, 
            transparent: true, 
            opacity: 0.5 
        });
        const networkLines = new THREE.LineSegments(lineGeometry, networkMaterial);
        worldGroup.add(networkLines);

        // 5. Додаємо дрібні неонові спалахи/зірки на задній фон
        const starsGeometry = new THREE.BufferGeometry();
        const starsPositions = [];
        for (let i = 0; i < 200; i++) {
            starsPositions.push((Math.random() - 0.5) * 25, (Math.random() - 0.5) * 25, (Math.random() - 0.5) * 50);
        }
        starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0x00f3ff, size: 0.08 });
        const starParticles = new THREE.Points(starsGeometry, starsMaterial);
        worldGroup.add(starParticles);


        // 6. Анімація та динаміка
        const localCameraPos = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);

            // Повільний автоматичний рух усієї мережі НА камеру
            worldGroup.position.z += 0.02;

            // Якщо мережа пролетіла повз нас — скидаємо її назад для нескінченного циклу
            if (worldGroup.position.z > 20) {
                worldGroup.position.z = -20;
            }

            // Робимо так, щоб кожне фото завжди дивилося на камеру (ефект Billboard)
            meshes.forEach(mesh => {
                // Вираховуємо позицію камери відносно рухомої групи
                localCameraPos.copy(camera.position).sub(worldGroup.position);
                mesh.lookAt(localCameraPos);
            });

            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        // Адаптивність під зміну розміру екрану
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
