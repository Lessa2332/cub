<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Нейромережа з Наскрізним Рухом</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000308; 
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000308); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Ставимо камеру на самий початок коридору
        camera.position.set(0, 0, 14); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        
        // КРИТИЧНО: Вимикаємо стандартний зум, бо ми написали свій, наскрізний
        controls.enableZoom = false;      

        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        const textureLoader = new THREE.TextureLoader();
        const count = 40; 
        const meshes = [];

        const photoPaths = [
            'foto/1.jpg',
            'foto/2.jpg',
            'foto/3.jpg'
        ];

        const baseGeometry = new THREE.PlaneGeometry(1, 1);

        for (let i = 0; i < count; i++) {
            const z = (i / count) * 24 - 12; // Коридор від -12 до 12
            const angle = i * 0.8;
            const radius = 3.5 + Math.random() * 2.5; 
            
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;

            const material = new THREE.MeshBasicMaterial({ 
                side: THREE.DoubleSide,
                visible: false 
            });

            const mesh = new THREE.Mesh(baseGeometry, material);
            mesh.position.set(x, y, z);
            worldGroup.add(mesh);
            meshes.push(mesh);

            const edges = new THREE.EdgesGeometry(baseGeometry);
            const lineMaterial = new THREE.LineBasicMaterial({ 
                color: 0x00f3ff, 
                linewidth: 2 
            });
            const wireframe = new THREE.LineSegments(edges, lineMaterial);
            wireframe.position.z = 0.005;
            mesh.add(wireframe);

            textureLoader.load(photoPaths[i % 3], function(texture) {
                const aspect = texture.image.width / texture.image.height;
                const baseHeight = 1.4; 
                const targetWidth = baseHeight * aspect;

                mesh.scale.set(targetWidth, baseHeight, 1);
                material.map = texture;
                material.visible = true;
                material.needsUpdate = true;
            });
        }

        // Побудова зв'язків
        const lineGeometry = new THREE.BufferGeometry();
        const linePositions = [];
        const lineColors = [];
        const colorNeonBlue = new THREE.Color(0x00f3ff);
        const colorNeonPink = new THREE.Color(0xff0077);

        for (let i = 0; i < count; i++) {
            for (let j = 1; j <= 2; j++) {
                const nextIndex = (i + j) % count;
                linePositions.push(meshes[i].position.x, meshes[i].position.y, meshes[i].position.z);
                linePositions.push(meshes[nextIndex].position.x, meshes[nextIndex].position.y, meshes[nextIndex].position.z);
                
                const chosenColor = Math.random() > 0.5 ? colorNeonBlue : colorNeonPink;
                lineColors.push(chosenColor.r, chosenColor.g, chosenColor.b);
                lineColors.push(chosenColor.r, chosenColor.g, chosenColor.b);
            }
        }
        lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
        lineGeometry.setAttribute('color', new THREE.Float32BufferAttribute(lineColors, 3));

        const networkMaterial = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.4 });
        const networkLines = new THREE.LineSegments(lineGeometry, networkMaterial);
        worldGroup.add(networkLines);

        // Світні точки
        const starsGeometry = new THREE.BufferGeometry();
        const starsPositions = [];
        for (let i = 0; i < 150; i++) {
            starsPositions.push((Math.random() - 0.5) * 20, (Math.random() - 0.5) * 20, (Math.random() - 0.5) * 30);
        }
        starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0x00f3ff, size: 0.06 });
        const starParticles = new THREE.Points(starsGeometry, starsMaterial);
        worldGroup.add(starParticles);


        // ==========================================
        // ЛОГІКА НАСКРІЗНОГО РУХУ (ПЕРЕМІЩЕННЯ ПО Z)
        // ==========================================
        
        function moveThroughCorridor(delta) {
            // Обмежуємо рух, щоб користувач не полетів у нескінченну порожнечу
            let newTargetZ = controls.target.z + delta;
            if (newTargetZ < -15) newTargetZ = -15; // Кліп перед задньою межею
            if (newTargetZ > 14) newTargetZ = 14;   // Кліп перед передньою межею
            
            const actualDelta = newTargetZ - controls.target.z;
            
            // Рухаємо вперед/назад і камеру, і точку її фокусування одночасно
            camera.position.z += actualDelta;
            controls.target.z += actualDelta;
        }

        // 1. Рух мишкою (коліщатко)
        window.addEventListener('wheel', (e) => {
            moveThroughCorridor(e.deltaY * 0.02);
        }, { passive: true });

        // 2. Рух пальцями на смартфонах (Pinch-to-zoom / Щипок)
        let touchStartDist = 0;
        
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                // Рахуємо початкову відстань між двома пальцями
                touchStartDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                // Рахуємо поточну відстань між пальцями під час руху
                const dist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                
                // Вираховуємо різницю (наближають пальці чи віддаляють)
                const delta = (touchStartDist - dist) * 0.04;
                moveThroughCorridor(delta);
                
                touchStartDist = dist; // Оновлюємо базову точку
            }
        }, { passive: true });


        const localCameraPos = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);

            meshes.forEach(mesh => {
                localCameraPos.copy(camera.position).sub(worldGroup.position);
                mesh.lookAt(localCameraPos);
            });

            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
