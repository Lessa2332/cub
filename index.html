<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Інтерактивний Фото-Глобус Землі</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b16; 
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <script>
        // --- 1. СЦЕНА, КАМЕРА ТА КЕРУВАННЯ ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b16); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8.5); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.minDistance = 4;      
        controls.maxDistance = 15;     

        // Створюємо групу для глобуса, щоб обертати все разом
        const globeGroup = new THREE.Group();
        scene.add(globeGroup);

        const textureLoader = new THREE.TextureLoader();

        // --- 2. НАЛАШТУВАННЯ ГЛОБУСА ТА ФОТО ---
        const radius = 4;          // Радіус нашої Землі
        const totalPoints = 750;   // Щільність точок на сфері
        const photoPaths = [
            'foto/1.jpg',
            'foto/2.jpg',
            'foto/3.jpg'
        ];

        // --- 3. СТВОРЕННЯ ЦИФРОВОГО ТРАФАРЕТУ СВІТУ ---
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = 360;
        maskCanvas.height = 180;
        const maskCtx = maskCanvas.getContext('2d');
        maskCtx.fillStyle = '#000000';
        maskCtx.fillRect(0, 0, 360, 180);
        maskCtx.fillStyle = '#ffffff';

        // Спрощені векторні контури материків для швидкої генерації
        function drawContinents(ctx) {
            // Північна Америка
            ctx.beginPath(); ctx.moveTo(30, 30); ctx.lineTo(100, 25); ctx.lineTo(130, 60); ctx.lineTo(95, 95); ctx.lineTo(60, 80); ctx.closePath(); ctx.fill();
            // Південна Америка
            ctx.beginPath(); ctx.moveTo(95, 95); ctx.lineTo(120, 105); ctx.lineTo(135, 120); ctx.lineTo(110, 170); ctx.lineTo(90, 130); ctx.closePath(); ctx.fill();
            // Євразія
            ctx.beginPath(); ctx.moveTo(150, 75); ctx.lineTo(160, 40); ctx.lineTo(200, 25); ctx.lineTo(280, 20); ctx.lineTo(340, 30); ctx.lineTo(330, 85); ctx.lineTo(240, 95); ctx.lineTo(180, 85); ctx.closePath(); ctx.fill();
            // Африка
            ctx.beginPath(); ctx.moveTo(165, 85); ctx.lineTo(210, 85); ctx.lineTo(230, 110); ctx.lineTo(215, 155); ctx.lineTo(190, 155); ctx.lineTo(165, 110); ctx.closePath(); ctx.fill();
            // Австралія
            ctx.beginPath(); ctx.moveTo(290, 120); ctx.lineTo(335, 125); ctx.lineTo(325, 150); ctx.lineTo(285, 140); ctx.closePath(); ctx.fill();
            // Гренландія
            ctx.beginPath(); ctx.moveTo(110, 15); ctx.lineTo(140, 15); ctx.lineTo(130, 35); ctx.closePath(); ctx.fill();
        }
        drawContinents(maskCtx);
        const imgData = maskCtx.getImageData(0, 0, 360, 180).data;

        // Функція перевірки: суша чи океан
        function isLand(x, y, z) {
            let u = Math.atan2(x, z) / (2 * Math.PI) + 0.5;
            let v = Math.acos(y / radius) / Math.PI;
            let px = Math.floor(u * 360);
            let py = Math.floor(v * 180);
            let idx = (py * 360 + px) * 4;
            return imgData[idx] > 200; 
        }

        // --- 4. МАСИВИ ДЛЯ ОКЕАНУ ТА МЕШІ ДЛЯ СУШІ ---
        const oceanVertices = [];
        const baseGeometry = new THREE.PlaneGeometry(1, 1);
        let photoIndex = 0;

        // Розподіляємо точки рівномірно по сфері (Алгоритм Фібоначчі)
        for (let i = 0; i < totalPoints; i++) {
            const phi = Math.acos(1 - 2 * (i + 0.5) / totalPoints);
            const theta = Math.sqrt(totalPoints * Math.PI) * phi;

            const x = radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.sin(theta);

            if (isLand(x, y, z)) {
                // МАТЕРИК: Ставимо фотокартку
                const material = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, visible: false });
                const mesh = new THREE.Mesh(baseGeometry, material);
                mesh.position.set(x, y, z);
                
                // Змушуємо фото дивитися точно від центру сфери назовні
                mesh.lookAt(x * 2, y * 2, z * 2);

                // Додаємо неонову рамку навколо фото
                const edges = new THREE.EdgesGeometry(baseGeometry);
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00f3ff, linewidth: 1.5 });
                const wireframe = new THREE.LineSegments(edges, lineMaterial);
                wireframe.position.z = 0.005;
                mesh.add(wireframe);

                globeGroup.add(mesh);

                // Завантажуємо фото
                textureLoader.load(photoPaths[photoIndex % photoPaths.length], function(texture) {
                    const aspect = texture.image.width / texture.image.height;
                    const baseHeight = 0.35; // Компактний розмір для сфери
                    mesh.scale.set(baseHeight * aspect, baseHeight, 1);
                    material.map = texture;
                    material.visible = true;
                    material.needsUpdate = true;
                });
                photoIndex++;
            } else {
                // ОКЕАН: Запам'ятовуємо координату для світляка
                oceanVertices.push(x, y, z);
            }
        }

        // Оптимізоване створення СВІТЛЯКІВ для океану (одним мешем для 60 FPS)
        const oceanGeometry = new THREE.BufferGeometry();
        oceanGeometry.setAttribute('position', new THREE.Float32BufferAttribute(oceanVertices, 3));
        const oceanMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.04,
            transparent: true,
            opacity: 0.7
        });
        const oceanPoints = new THREE.Points(oceanGeometry, oceanMaterial);
        globeGroup.add(oceanPoints);

        // --- 5. АНІМАЦІЯ ТА ОБЕРТАННЯ ---
        function animate() {
            requestAnimationFrame(animate);

            // Повільне автоматичне обертання глобуса, якщо користувач його не чіпає
            if (!controls.state == -1) {
                globeGroup.rotation.y += 0.0015;
            } else {
                globeGroup.rotation.y += 0.0005; // Легке обертання під час взаємодії
            }

            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        // Адаптація під розміри екрану смартфона/ПК
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
