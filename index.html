<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Фото-Куля (Правильні пропорції)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #062c30; 
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x062c30); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 8; 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;      
        controls.maxDistance = 15;     

        const textureLoader = new THREE.TextureLoader();
        const count = 45; 
        const radius = 4; 

        const photoPaths = [
            'foto/1.jpg',
            'foto/2.jpg',
            'foto/3.jpg'
        ];

        // Базова геометрія 1x1. Ми будемо масштабувати її динамічно під кожне фото
        const baseGeometry = new THREE.PlaneGeometry(1, 1);

        for (let i = 0; i < count; i++) {
            const phi = Math.acos(1 - 2 * (i + 0.5) / count);
            const theta = Math.sqrt(count * Math.PI) * phi;

            const x = radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.sin(theta);

            // Створюємо матеріал. Тимчасово робимо його невидимим, поки фото не завантажиться
            const material = new THREE.MeshBasicMaterial({ 
                side: THREE.DoubleSide,
                visible: false 
            });

            const mesh = new THREE.Mesh(baseGeometry, material);
            mesh.position.set(x, y, z);
            mesh.lookAt(x * 2, y * 2, z * 2);

            // Створення базової неонової рамки 1x1 всередині меша
            const edges = new THREE.EdgesGeometry(baseGeometry);
            const lineMaterial = new THREE.LineBasicMaterial({ 
                color: 0x00f3ff, 
                linewidth: 2 
            });
            const wireframe = new THREE.LineSegments(edges, lineMaterial);
            wireframe.position.z = 0.005; // мінімальний зсув вперед, щоб не було мигтіння текстури
            mesh.add(wireframe);

            scene.add(mesh);

            // Асинхронне завантаження фотографії
            textureLoader.load(photoPaths[i % 3], function(texture) {
                // Рахуємо пропорцію зображення (ширина поділена на висоту)
                const aspect = texture.image.width / texture.image.height;
                
                // Задаємо бажану базову висоту для всіх фото на екрані (наприклад, 1.2)
                const baseHeight = 1.2;
                // Автоматично вираховуємо ширину, яка збереже оригінальні пропорції
                const targetWidth = baseHeight * aspect;

                // Масштабуємо рамку разом із фото
                mesh.scale.set(targetWidth, baseHeight, 1);

                // Додаємо текстуру в матеріал і робимо її видимою
                material.map = texture;
                material.visible = true;
                material.needsUpdate = true;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
