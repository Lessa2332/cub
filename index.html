<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Нейромережа з Безмежним Наближенням</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000308; 
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000308); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Камера стоїть попереду на безпечній відстані
        camera.position.set(0, 0, 8); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // OrbitControls тепер відповідає ТІЛЬКИ за гарне обертання навколо центру
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enableZoom = false; // Вимикаємо старий зум, бо керуємо рухом світу самостійно

        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        const textureLoader = new THREE.TextureLoader();
        const count = 40; // Ваша кількість фото
        const meshes = [];
        const baseGeometry = new THREE.PlaneGeometry(1, 1);

        // Будуємо тунель, який іде вглиб екрана (від 0 до -24)
        for (let i = 0; i < count; i++) {
            const z = -(i / count) * 24; 
            const angle = i * 0.8;
            const radius = 3.5 + Math.random() * 2.5; 
            
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;

            const material = new THREE.MeshBasicMaterial({ 
                side: THREE.DoubleSide,
                visible: false 
            });

            const mesh = new THREE.Mesh(baseGeometry, material);
            mesh.position.set(x, y, z);
            worldGroup.add(mesh);
            meshes.push(mesh);

            const edges = new THREE.EdgesGeometry(baseGeometry);
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00f3ff, linewidth: 2 });
            const wireframe = new THREE.LineSegments(edges, lineMaterial);
            wireframe.position.z = 0.005;
            mesh.add(wireframe);

            // АВТОМАТИЧНЕ ЗАВАНТАЖЕННЯ: підставляє файли від 1.jpg до 40.jpg
            const photoNumber = (i % 40) + 1; 
            textureLoader.load(`foto/${photoNumber}.jpg`, function(texture) {
                const aspect = texture.image.width / texture.image.height;
                const baseHeight = 1.4; 
                const targetWidth = baseHeight * aspect;

                mesh.scale.set(targetWidth, baseHeight, 1);
                material.map = texture;
                material.visible = true;
                material.needsUpdate = true;
            });
        }

        // Побудова нейронних зв'язків (ліній)
        const lineGeometry = new THREE.BufferGeometry();
        const linePositions = [];
        const lineColors = [];
        const colorNeonBlue = new THREE.Color(0x00f3ff);
        const colorNeonPink = new THREE.Color(0xff0077);

        for (let i = 0; i < count; i++) {
            for (let j = 1; j <= 2; j++) {
                const nextIndex = (i + j) % count;
                linePositions.push(meshes[i].position.x, meshes[i].position.y, meshes[i].position.z);
                linePositions.push(meshes[nextIndex].position.x, meshes[nextIndex].position.y, meshes[nextIndex].position.z);
                
                const chosenColor = Math.random() > 0.5 ? colorNeonBlue : colorNeonPink;
                lineColors.push(chosenColor.r, chosenColor.g, chosenColor.b);
                lineColors.push(chosenColor.r, chosenColor.g, chosenColor.b);
            }
        }
        lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
        lineGeometry.setAttribute('color', new THREE.Float32BufferAttribute(lineColors, 3));

        const networkMaterial = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.4 });
        const networkLines = new THREE.LineSegments(lineGeometry, networkMaterial);
        worldGroup.add(networkLines);

        // Космічний пил / зірки
        const starsGeometry = new THREE.BufferGeometry();
        const starsPositions = [];
        for (let i = 0; i < 150; i++) {
            starsPositions.push((Math.random() - 0.5) * 20, (Math.random() - 0.5) * 20, -(Math.random()) * 30);
        }
        starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0x00f3ff, size: 0.06 });
        const starParticles = new THREE.Points(starsGeometry, starsMaterial);
        worldGroup.add(starParticles);


        // ==========================================
        // КЕРУВАННЯ РУХОМ СВІТУ (ПЕРЕМІЩЕННЯ ГРУПИ)
        // ==========================================
        function moveWorld(delta) {
            worldGroup.position.z += delta;
            
            // Обмежуємо рух: 
            // -2: не дає відлетіти занадто далеко назад від перших фото
            // 28: дозволяє протягнути навіть найвіддаленіші фото впритул до камери
            if (worldGroup.position.z < -2) worldGroup.position.z = -2;
            if (worldGroup.position.z > 28) worldGroup.position.z = 28;
        }

        // 1. Прокрутка мишкою
        window.addEventListener('wheel', (e) => {
            // Крутимо коліщатко вгору — світ рухається на нас (вглиб)
            moveWorld(-e.deltaY * 0.015);
        }, { passive: true });

        // 2. Жести на смартфонах (Щипок / Pinch)
        let touchStartDist = 0;
        
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                touchStartDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                
                // Пальці розводяться (зум) -> підтягуємо світ ближче
                const delta = (dist - touchStartDist) * 0.03;
                moveWorld(delta);
                
                touchStartDist = dist;
            }
        }, { passive: true });


        const localCameraPos = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);

            // Оскільки група рухається, вираховуємо позицію камери в локальних координатах рухомої групи
            meshes.forEach(mesh => {
                localCameraPos.copy(camera.position).sub(worldGroup.position);
                mesh.lookAt(localCameraPos);
            });

            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
